<text x="76.8" y="106.31" font-family="Arial, Arial, sans-serif" font-size="56.89" fill="#F8FAFC" text-anchor="start" font-weight="bold">The Problem</text>
<text x="140.8" y="248.8" font-family="Arial, Arial, sans-serif" font-size="32" fill="#B8C4D9" text-anchor="start">Field teams capture inspections on paper and spreadsheets</text>
<text x="140.8" y="342.4" font-family="Arial, Arial, sans-serif" font-size="32" fill="#B8C4D9" text-anchor="start">Data reaches decision-makers 2–3 weeks late</text>
<text x="140.8" y="436" font-family="Arial, Arial, sans-serif" font-size="32" fill="#B8C4D9" text-anchor="start">Compliance audits require manual reconstruction of every visit</text>
